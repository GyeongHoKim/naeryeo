name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install mise-managed toolchain
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Run quality gates
        run: just check
