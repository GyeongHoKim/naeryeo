name: 기능 제안
description: 새로운 기능이나 개선 아이디어를 제안합니다.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        아이디어를 제안해 주셔서 감사합니다.
        먼저 [기존 이슈](https://github.com/GyeongHoKim/naeryeo/issues)에 유사한 제안이 있는지 검색해 주세요.

  - type: textarea
    id: problem
    attributes:
      label: 어떤 문제를 해결하나요?
      description: 이 기능이 필요한 배경이나 겪고 있는 불편을 설명해 주세요.
      placeholder: "...할 때 매번 ...해야 해서 불편합니다."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 해결 방법
      description: 원하는 동작이나 CLI/MCP 인터페이스를 구체적으로 적어 주세요.
      placeholder: |
        예: `naeryeo route --time 08:30` 처럼 출발 시각을 지정할 수 있으면 좋겠습니다.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안
      description: 검토했던 다른 방법이나 우회책이 있다면 적어 주세요.

  - type: textarea
    id: context
    attributes:
      label: 추가 정보
      description: 참고 자료, 스크린샷, 관련 ODsay API 문서 링크 등을 자유롭게 남겨 주세요.

  - type: checkboxes
    id: checks
    attributes:
      label: 확인 사항
      options:
        - label: 기존 이슈에서 중복되는 제안을 검색했습니다.
          required: true
